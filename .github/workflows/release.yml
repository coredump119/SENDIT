name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Read version from pubspec
        id: ver
        shell: bash
        run: |
          V=$(grep '^version:' pubspec.yaml | sed 's/version: *//; s/+.*//')
          echo "version=$V" >> "$GITHUB_OUTPUT"

      - name: Build
        run: |
          flutter pub get
          flutter build windows --release

      - name: Zip portable build
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Compress-Archive -Path build\windows\x64\runner\Release\* -DestinationPath dist\SENDIT-${{ steps.ver.outputs.version }}-windows-portable.zip

      - name: Build installer (Inno Setup)
        shell: pwsh
        run: |
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" /DAppVersion=${{ steps.ver.outputs.version }} /DSourceDir="$PWD\build\windows\x64\runner\Release" installer\windows.iss

      - name: Stable-name copies (so /releases/latest/download/... never goes stale)
        shell: pwsh
        run: |
          Copy-Item dist\SENDIT-${{ steps.ver.outputs.version }}-windows-setup.exe dist\SENDIT-windows-setup.exe
          Copy-Item dist\SENDIT-${{ steps.ver.outputs.version }}-windows-portable.zip dist\SENDIT-windows-portable.zip

      - name: Upload artifacts (manual runs)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/*

      - name: Publish release (tag runs)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
